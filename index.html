<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>AR Video Debug</title>


<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<style>

body{
    margin:0;
    overflow:hidden;
}


#debug{

    position:fixed;
    z-index:999;

    left:10px;
    bottom:10px;

    background:rgba(0,0,0,.75);

    color:white;

    padding:10px;

    font-size:13px;

    line-height:20px;

}

</style>


</head>



<body>


<div id="debug">
加载中...
</div>



<a-scene


mindar-image="
imageTargetSrc: ./targets.mind;
autoStart:true;
"


embedded


renderer="
alpha:true;
antialias:true;
colorManagement:true;
"


vr-mode-ui="enabled:false"


device-orientation-permission-ui="enabled:false"



>


<a-assets>


<video

id="video"

src="./200.mp4"

loop

muted

playsinline

webkit-playsinline

crossorigin="anonymous"

></video>


</a-assets>




<a-camera

position="0 0 0">

</a-camera>




<a-entity

id="target"

mindar-image-target="targetIndex:0">


<a-plane

id="screen"

position="0 0 0"

rotation="0 0 0"

width="2.4"

height="1.8"

material="
shader:flat;
side:double;
">

</a-plane>


</a-entity>



</a-scene>




<script>


const video =
document.querySelector("#video");


const screen =
document.querySelector("#screen");


const target =
document.querySelector("#target");


const debug =
document.querySelector("#debug");



// 创建视频纹理

const texture =
new THREE.VideoTexture(video);


texture.minFilter =
THREE.LinearFilter;


texture.magFilter =
THREE.LinearFilter;



// 绑定纹理

screen.addEventListener(
"loaded",
()=>{

const mesh =
screen.getObject3D("mesh");


if(mesh){

mesh.material.map =
texture;

mesh.material.needsUpdate=true;

}

});




// 调试信息

setInterval(()=>{

debug.innerHTML =

`
readyState: ${video.readyState}<br>
paused: ${video.paused}<br>
currentTime: ${video.currentTime.toFixed(2)}<br>
duration: ${video.duration ? video.duration.toFixed(2) : 0}<br>
loop: ${video.loop}
`;

},500);




// 识别成功

target.addEventListener(

"targetFound",

()=>{


video.currentTime=0;


video.play();


});




// 丢失暂停

target.addEventListener(

"targetLost",

()=>{


video.pause();


});




// 点击屏幕强制播放

document.body.addEventListener(

"click",

()=>{


video.play();


});



</script>


</body>

</html>
