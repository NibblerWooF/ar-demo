<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>AR Camera Test</title>


<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}


#start{

    position:fixed;
    z-index:9999;

    top:30px;
    left:50%;

    transform:translateX(-50%);

    padding:15px 25px;

    font-size:18px;

}


#status{

    position:fixed;
    z-index:9999;

    bottom:20px;
    left:10px;

    background:rgba(0,0,0,.7);

    color:white;

    padding:10px;

}

</style>


</head>


<body>


<button id="start">
启动AR
</button>


<div id="status">
等待启动
</div>



<a-scene


mindar-image="

imageTargetSrc: ./targets.mind;

autoStart: false;

uiLoading: yes;

uiScanning: yes;

uiError: yes;

"


embedded


renderer="

alpha:true;

antialias:true;

colorManagement:true;

"


vr-mode-ui="enabled:false"


device-orientation-permission-ui="enabled:false"


>


<a-camera

position="0 0 0"

look-controls="enabled:false">

</a-camera>



<a-entity

mindar-image-target="targetIndex:0">

</a-entity>



</a-scene>



<script>


const button =
document.querySelector("#start");


const status =
document.querySelector("#status");


const scene =
document.querySelector("a-scene");



button.onclick = ()=>{


status.innerHTML="正在启动摄像头...";


// 启动 MindAR

scene.systems["mindar-image-system"].start();



};



scene.addEventListener(

"arReady",

()=>{

status.innerHTML="AR已启动";

}

);



scene.addEventListener(

"arError",

()=>{

status.innerHTML="AR启动失败";

}

);



</script>


</body>

</html>
