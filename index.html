<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>AR Video Demo</title>


<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}


#tip{

    position:fixed;
    z-index:10;

    bottom:30px;
    left:50%;

    transform:translateX(-50%);

    background:rgba(0,0,0,.6);

    color:white;

    padding:10px 20px;

    border-radius:20px;

    font-size:14px;

}

</style>


</head>


<body>


<div id="tip">
正在启动AR...
</div>



<a-scene


mindar-image="

imageTargetSrc: ./targets.mind;

autoStart:true;

"


color-space="sRGB"


renderer="

colorManagement:true;

antialias:true;

"


vr-mode-ui="enabled:false"


device-orientation-permission-ui="enabled:false"


>



<a-assets>


<video

id="video"

src="./200.mp4"

loop

muted

playsinline

webkit-playsinline

crossorigin="anonymous">

</video>


</a-assets>




<a-camera

position="0 0 0"

look-controls="enabled:false">

</a-camera>




<a-entity

id="target"

mindar-image-target="targetIndex:0">


<a-plane

id="video-plane"

position="0 0 0"

rotation="90 0 0"

width="11.2"

height="8.4"

material="

shader:flat;

src:#video;

side:double;

">

</a-plane>



</a-entity>



</a-scene>




<script>


const target =
document.querySelector("#target");


const video =
document.querySelector("#video");


const plane =
document.querySelector("#video-plane");


const tip =
document.querySelector("#tip");




// 视频纹理翻转

plane.addEventListener(
"loaded",
()=>{


const mesh =
plane.getObject3D("mesh");


if(mesh){


const texture =
mesh.material.map;


if(texture){


texture.repeat.y = -1;

texture.offset.y = 1;


texture.needsUpdate = true;


}


}


});





// AR启动

document.querySelector("a-scene")
.addEventListener(

"arReady",

()=>{

tip.innerHTML="请对准识别图";

}

);




// 识别成功

target.addEventListener(

"targetFound",

()=>{


tip.innerHTML="识别成功";


video.currentTime=0;


video.play();


}

);




// 丢失暂停

target.addEventListener(

"targetLost",

()=>{


tip.innerHTML="重新对准";


video.pause();


});



// 点击播放

document.body.addEventListener(

"click",

()=>{

video.play();

});


</script>



</body>

</html>
