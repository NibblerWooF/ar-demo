<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>AR Demo</title>


<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}


#tip{
    position:fixed;
    z-index:10;

    bottom:30px;
    left:50%;

    transform:translateX(-50%);

    padding:10px 18px;

    background:rgba(0,0,0,0.6);

    color:white;

    border-radius:20px;

    font-size:14px;
}

</style>


</head>


<body>


<div id="tip">
请对准识别图片
</div>



<a-scene

mindar-image="
imageTargetSrc: ./targets.mind;
autoStart: true;
uiScanning: yes;
"

embedded

renderer="
alpha:true;
antialias:true;
colorManagement:true;
"

vr-mode-ui="enabled:false"

device-orientation-permission-ui="enabled:false"

>


<a-assets>


<video

id="ar-video"

src="./200.mp4"

loop

muted

autoplay

playsinline

webkit-playsinline

crossorigin="anonymous"

></video>


</a-assets>




<a-camera

position="0 0 0"

look-controls="enabled:false">

</a-camera>




<a-entity

id="target"

mindar-image-target="targetIndex:0">


<a-plane

id="video-plane"

src="#ar-video"

position="0 0 0"

rotation="90 0 0"

width="2.4"

height="1.8"

material="
shader:flat;
side:double;
"

></a-plane>



</a-entity>



</a-scene>




<script>


const target =
document.querySelector("#target");


const tip =
document.querySelector("#tip");


const video =
document.querySelector("#ar-video");



target.addEventListener(

"targetFound",

()=>{

    tip.innerHTML="识别成功";


    video.play();


    setTimeout(()=>{

        tip.style.display="none";

    },1000);


});



target.addEventListener(

"targetLost",

()=>{

    tip.style.display="block";

    tip.innerHTML="请重新对准图片";


    video.pause();

});


</script>



</body>

</html>
