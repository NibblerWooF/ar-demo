<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Video Test</title>


<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<style>

body{
    margin:0;
    overflow:hidden;
}


#debug{

    position:fixed;
    left:10px;
    bottom:10px;

    z-index:999;

    background:rgba(0,0,0,.7);

    color:white;

    padding:12px;

    font-size:14px;

    line-height:22px;

}

</style>


</head>


<body>


<div id="debug">
加载中...
</div>



<a-scene


mindar-image="
imageTargetSrc: ./targets.mind;
autoStart:true;
uiScanning:yes;
"


embedded


renderer="
alpha:true;
antialias:true;
colorManagement:true;
"


vr-mode-ui="enabled:false"


device-orientation-permission-ui="enabled:false"


>


<a-assets>


<video

id="video"

src="./200.mp4"

loop

muted

autoplay

playsinline

webkit-playsinline

crossorigin="anonymous">

</video>


</a-assets>




<a-camera
position="0 0 0">

</a-camera>



<a-entity

id="target"

mindar-image-target="targetIndex:0">


<a-video

id="videoPlane"

src="#video"

position="0 0 0"

rotation="0 0 0"

width="2.8"

height="2.1"

>

</a-video>


</a-entity>



</a-scene>




<script>


const video =
document.querySelector("#video");


const target =
document.querySelector("#target");


const debug =
document.querySelector("#debug");



// 页面加载立即播放

window.onload=()=>{

video.play()
.then(()=>{

console.log("video playing");

})
.catch(e=>{

console.log(e);

});

};




// 点击强制播放

document.body.onclick=()=>{

video.play();

};




// AR识别

target.addEventListener(
"targetFound",
()=>{

debug.innerHTML += "<br>识别成功";


video.play();


});



target.addEventListener(
"targetLost",
()=>{

debug.innerHTML += "<br>丢失";

});



// 调试

setInterval(()=>{


debug.innerHTML=

`
readyState:${video.readyState}<br>

paused:${video.paused}<br>

time:${video.currentTime.toFixed(2)}<br>

duration:${video.duration ? video.duration.toFixed(2):0}

`;


},500);


</script>



</body>

</html>
